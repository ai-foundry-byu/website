window.loadAIF("../../").then((NS)=>{

function Demo(){return <div style={{display:'flex',flexDirection:'column',gap:18}}>
  <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
    <Button variant="primary">Work with us</Button>
    <Button variant="secondary">Join the network</Button>
    <Button variant="ghost">See all our work</Button>
    <Button variant="primary" loading>Sending</Button>
    <Button variant="primary" disabled>Disabled</Button>
    <span style={{background:'var(--navy)',padding:'10px',display:'inline-flex'}}><Button variant="inverse">On navy</Button></span>
  </div>
  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
    <Input label="Email" type="email" required placeholder="you@company.com" />
    <Input label="Company" required error="Company is required." defaultValue="" />
    <Select label="When do you need it" options={["As soon as possible","Within a semester","Within the year","Exploring, no date yet"]} placeholder="Choose one" />
    <Textarea label="What do you want built" required rows={2} hint="A few sentences is plenty." />
  </div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
});
</script>
