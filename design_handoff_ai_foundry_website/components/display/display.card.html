<script type="text/plain" data-jsx-src>
window.loadAIF("../../").then((NS)=>{
const {SectionHeader,Card,Stat,Badge,Table,Icon}=NS;
function Demo(){return <div style={{display:'flex',flexDirection:'column',gap:22}}>
  <SectionHeader eyebrow="What we build" title="Working software, judged by what ships." lead="Every engagement is scoped in writing." />
  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,alignItems:'start'}}>
    <Card title="Full-stack applications" blurb="Net-new web and mobile applications." points={["Customer-facing products","Internal tools"]} />
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      <div style={{display:'flex',gap:28}}><Stat value="30" caption="students" /><Stat value="9" caption="employers on the strip" /></div>
      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}><Badge>Open source</Badge><Badge tone="accent">Live</Badge><Badge>Healthcare</Badge></div>
      <div style={{display:'flex',gap:14,color:'var(--navy)',alignItems:'center'}}><Icon name="arrow--right"/><Icon name="arrow--up-right"/><Icon name="close"/><Icon name="checkmark"/><Icon name="launch"/><Icon name="menu"/><Icon name="search"/><Icon name="warning"/><span class="caption" style={{color:'var(--slate)'}}>Carbon, 20px, currentColor</span></div>
    </div>
  </div>
  <Table columns={[{key:'phase',label:'Phase'},{key:'item',label:'Item'},{key:'status',label:'Status',align:'right'}]} rows={[{phase:'1 Foundation',item:'Mission, brand, and website',status:'live'},{phase:'1 Foundation',item:'Advisory board',status:'active'},{phase:'2 Community',item:'Launch party',status:'planned'}]} />
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
});
