<style>body{margin:0;padding:18px;background:#fff}</style>
<div id="root"></div>
<script type="text/plain" data-jsx-src>
window.loadAIF("../../").then((NS)=>{
const {Dialog,EmptyState,Progress,Button}=NS;
function Demo(){
  const [open,setOpen]=React.useState(false);
  return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18,alignItems:'start'}}>
    <div style={{display:'flex',flexDirection:'column',gap:18}}>
      <Progress value={4} max={10} label="Claude Architect certification" caption="Leadership first, then the wider roster." />
      <Button variant="secondary" onClick={()=>setOpen(true)}>Open dialog</Button>
    </div>
    <EmptyState eyebrow="No projects yet" title="Nothing is being scoped right now." detail="Submit a project and it lands here." />
    <Dialog open={open} onClose={()=>setOpen(false)} title="Withdraw this proposal?" actions={[{label:'Withdraw',onClick:()=>setOpen(false)},{label:'Keep it',variant:'secondary',onClick:()=>setOpen(false)}]}>This removes the request from scoping. One plain sentence, nothing dramatic.</Dialog>
  </div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
});
</script>
<script>
(function(){var el=document.querySelector('script[data-jsx-src]');var out=Babel.transform(el.textContent,{presets:[[Babel.availablePresets.react,{runtime:"classic"}]]}).code;(0,eval)(out);})();
</script>
