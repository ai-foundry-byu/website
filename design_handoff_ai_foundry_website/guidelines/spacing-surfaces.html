<!-- @dsCard group="Spacing" viewport="700x210" name="Surfaces + states" subtitle="Boxes round at 4-6px (token 5px). Hairlines, not shadows. Presses feel stamped." -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:#fff}</style>
<div style="display:flex;gap:14px;align-items:stretch"><div style="flex:1;border:1px solid var(--border-hairline);border-radius:var(--radius);padding:14px"><div style="font-weight:600;font-size:14px">Card</div><div class="caption" style="color:var(--slate);margin-top:4px">1px hairline · radius 5px · no shadow</div></div><div style="flex:1;display:flex;flex-direction:column;gap:8px;justify-content:center"><button style="font-family:var(--font-body);font-weight:500;font-size:14px;background:var(--royal);color:#fff;border:0;border-radius:var(--radius);padding:12px 20px;cursor:pointer">Hover → navy</button><button style="font-family:var(--font-body);font-weight:500;font-size:14px;background:var(--royal);color:#fff;border:0;border-radius:var(--radius);padding:12px 20px;transform:translateY(1px)">Press → down 1px</button></div><div style="flex:1;display:flex;align-items:center;justify-content:center"><span style="outline:2px solid var(--royal);outline-offset:2px;padding:10px 16px;font-size:14px;font-weight:500">Focus ring</span></div></div>
